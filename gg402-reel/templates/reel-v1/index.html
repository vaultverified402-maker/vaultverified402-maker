<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GG402 Reel — reel-v1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    background: #090909;
    overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
  }

  #stage { position: relative; width: 1080px; height: 1920px; }
  .top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: #00D4FF; }

  .block {
    position: absolute;
    left: 80px;
    right: 80px;
    opacity: 0;
    transform: translateY(24px);
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes revealAndHide {
    0% { opacity: 0; transform: translateY(24px); }
    15% { opacity: 1; transform: translateY(0); }
    85% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-16px); }
  }

  .hook { top: 640px; animation: revealAndHide 2s ease-in-out .2s forwards; }
  .hook .line { font-size: 58px; font-weight: 700; color: #F5F5F3; letter-spacing: 2px; line-height: 1.2; }

  .header { top: 140px; animation: reveal .6s ease-out 1s forwards; }
  .header .brand { font-size: 40px; font-weight: 700; color: #00D4FF; letter-spacing: 8px; }
  .header .sub { margin-top: 14px; font-size: 22px; color: #8A8A8A; }

  .event { top: 520px; animation: reveal .6s ease-out 2.3s forwards; }
  .event .label, .selection .label { font-size: 26px; color: #8A8A8A; letter-spacing: 4px; }
  .event .value { margin-top: 20px; font-size: 42px; font-weight: 700; color: #F5F5F3; line-height: 1.25; }

  .selection { top: 860px; animation: reveal .6s ease-out 4.5s forwards; }
  .selection .value { margin-top: 20px; font-size: 62px; font-weight: 700; color: #F5F5F3; line-height: 1.2; }
  .selection .odds { margin-top: 16px; font-size: 34px; color: #00D4FF; }

  .status { top: 1220px; animation: reveal .6s ease-out 7s forwards; }
  .status .badge {
    display: inline-block;
    border: 3px solid #00D4FF;
    border-radius: 6px;
    padding: 18px 32px;
    font-size: 32px;
    font-weight: 700;
    color: #00D4FF;
    letter-spacing: 5px;
  }

  .footer { top: 1500px; animation: reveal .6s ease-out 8.7s forwards; }
  .footer .record-id { font-size: 30px; color: #8A8A8A; }
  .footer .cta { margin-top: 26px; font-size: 36px; font-weight: 700; color: #F5F5F3; }
  .footer .url { margin-top: 10px; font-size: 26px; color: #00D4FF; }
  .footer .disclaimer { position: absolute; bottom: 60px; font-size: 20px; color: #8A8A8A; line-height: 1.6; }

  .cover-mode .block { animation: none !important; opacity: 1 !important; transform: none !important; }
  .cover-mode .hook { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <div class="top-bar"></div>

    <div class="block hook"><div class="line">FILED BEFORE<br>THE RESULT</div></div>

    <div class="block header">
      <div class="brand">VAULT VERIFIED</div>
      <div class="sub">Public record · immutable</div>
    </div>

    <div class="block event">
      <div class="label">EVENT</div>
      <div class="value" id="event-value">—</div>
    </div>

    <div class="block selection">
      <div class="label">SELECTION</div>
      <div class="value" id="selection-value">—</div>
      <div class="odds" id="odds-value"></div>
    </div>

    <div class="block status"><div class="badge" id="status-value">—</div></div>

    <div class="block footer">
      <div class="record-id" id="record-id-value">—</div>
      <div class="cta">View the preserved record</div>
      <div class="url">vaultverified.app</div>
      <div class="disclaimer">This record cannot be edited after filing.<br>No outcome is guaranteed.</div>
    </div>
  </div>

  <script>
    const d = window.RECORD_DATA || {};
    document.getElementById('event-value').textContent = d.event || 'Event';
    document.getElementById('selection-value').textContent = d.selection || 'Selection filed';
    document.getElementById('odds-value').textContent = d.odds ? `ODDS ${d.odds}` : '';
    document.getElementById('status-value').textContent = String(d.status || 'PRESERVED').toUpperCase();
    document.getElementById('record-id-value').textContent = d.record_id || '';

    if (new URLSearchParams(window.location.search).get('cover') === '1') {
      document.getElementById('stage').classList.add('cover-mode');
    }

    window.REEL_READY = true;
  </script>
</body>
</html>
