name: Render GG402 Reel

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: Record ID
        required: true
        default: REC-2026-0161
      consultant_id:
        description: Consultant ID
        required: true
        default: GG402-0001
      handle:
        description: Consultant handle
        required: true
        default: gamedayguru402
      event:
        description: Event text
        required: true
        default: Texas Rangers @ Tampa Bay Rays
      selection:
        description: Selection text
        required: true
        default: Tampa Bay Rays
      odds:
        description: Odds
        required: false
        default: -136
      status:
        description: Record status
        required: true
        default: preserved
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-gg402-reel.yml'
      - 'gg402-reel/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gg402-reel
    env:
      RECORD_ID: ${{ inputs.record_id || 'REC-2026-0161' }}
      CONSULTANT_ID: ${{ inputs.consultant_id || 'GG402-0001' }}
      HANDLE: ${{ inputs.handle || 'gamedayguru402' }}
      EVENT_TEXT: ${{ inputs.event || 'Texas Rangers @ Tampa Bay Rays' }}
      SELECTION_TEXT: ${{ inputs.selection || 'Tampa Bay Rays' }}
      ODDS: ${{ inputs.odds || '-136' }}
      STATUS: ${{ inputs.status || 'preserved' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gg402-reel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-ibm-plex
          npx playwright install --with-deps chromium

      - name: Build record data safely
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = {
            record_id: process.env.RECORD_ID,
            consultant_id: process.env.CONSULTANT_ID,
            handle: process.env.HANDLE,
            event: process.env.EVENT_TEXT,
            selection: process.env.SELECTION_TEXT,
            odds: process.env.ODDS,
            status: process.env.STATUS,
            record_url: `https://vaultverified.app/record/${encodeURIComponent(process.env.RECORD_ID)}`
          };
          fs.writeFileSync('record-data.json', JSON.stringify(d, null, 2));
          NODE

      - name: Render HTML reel
        run: node render/render.mjs record-data.json output

      - name: Convert to social master MP4
        run: |
          chmod +x render/postprocess.sh
          ./render/postprocess.sh output/reel.raw.webm output/reel.mp4

      - name: Generate manifest and captions
        run: |
          HASH=$(sha256sum output/reel.mp4 | cut -d' ' -f1)
          node render/generate-manifest.mjs record-data.json "$HASH" output

      - name: Validate output
        run: |
          ffprobe -v error \
            -show_entries stream=codec_name,codec_type,width,height,pix_fmt \
            -show_entries format=duration \
            -of json output/reel.mp4
          test "$(file -b --mime-type output/reel.mp4)" = "video/mp4"
          test -s output/cover.png
          test -s output/manifest.json
          test -s output/caption.json

      - uses: actions/upload-artifact@v4
        with:
          name: gg402-reel-${{ env.RECORD_ID }}
          path: |
            gg402-reel/output/reel.mp4
            gg402-reel/output/cover.png
            gg402-reel/output/manifest.json
            gg402-reel/output/caption.json
          retention-days: 1
          if-no-files-found: error
