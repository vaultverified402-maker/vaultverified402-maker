name: Apply public view migration

on:
  push:
    branches:
      - preview/public-view-query-migration

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[migration-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/public-view-query-migration
          fetch-depth: 0

      - name: Apply exact query replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "index.html": [
                  (
                      '''  function parseTotal(contentRange) { if (!contentRange) return null; var total = contentRange.split("/")[1]; if (total === "*" || total === undefined) return null; var n = parseInt(total, 10); return isNaN(n) ? null : n; }
  function loadCount(queryPath, elId) { var el = document.getElementById(elId); fetch(SUPABASE_URL + "/rest/v1/" + queryPath, { method:"HEAD", headers:headers({ Prefer:"count=exact", Range:"0-0" }) }).then(function (res) { var total = parseTotal(res.headers.get("content-range")); if (total === null) throw new Error("no count"); el.textContent = String(total); }).catch(function () { el.textContent = "Live"; }); }
  function loadFirstRecordDate() { var el = document.getElementById("metric-since"); fetch(SUPABASE_URL + "/rest/v1/records?select=created_at&source_type=eq.pre_event_filing&order=created_at.asc&limit=1", { headers:headers() }).then(function (res) { if (!res.ok) throw new Error("Request failed: " + res.status); return res.json(); }).then(function (rows) { if (!rows || !rows.length || !rows[0].created_at) throw new Error("empty"); var label = formatDate(rows[0].created_at, { day:undefined, year:"numeric" }); if (!label) throw new Error("bad date"); el.textContent = label; }).catch(function () { el.textContent = "2026"; }); }
  loadCount("records?select=*&source_type=eq.pre_event_filing", "metric-records");
  loadCount("profiles?select=*&visibility=eq.public&consultant_type=neq.archive", "metric-consultants");
  loadFirstRecordDate();''',
                      '''  function loadMetrics() {
    var recordsEl = document.getElementById("metric-records");
    var consultantsEl = document.getElementById("metric-consultants");
    var sinceEl = document.getElementById("metric-since");
    fetch(SUPABASE_URL + "/rest/v1/v_public_platform_stats?select=total_records_preserved,total_public_consultants,earliest_public_record_at", { headers:headers() })
      .then(function (res) { if (!res.ok) throw new Error("Request failed: " + res.status); return res.json(); })
      .then(function (rows) {
        var stats = rows && rows[0];
        if (!stats) throw new Error("empty");
        recordsEl.textContent = stats.total_records_preserved != null ? String(stats.total_records_preserved) : "Live";
        consultantsEl.textContent = stats.total_public_consultants != null ? String(stats.total_public_consultants) : "Live";
        var label = formatDate(stats.earliest_public_record_at, { day:undefined, year:"numeric" });
        sinceEl.textContent = label || "2026";
      })
      .catch(function () { recordsEl.textContent = "Live"; consultantsEl.textContent = "Live"; sinceEl.textContent = "2026"; });
  }
  loadMetrics();'''
                  ),
                  ('/rest/v1/records?select=record_id,profile_id,sport,league,selection,event,status,result_status,grading_state,preserved_at,created_at&source_type=eq.pre_event_filing', '/rest/v1/v_public_records?select=record_id,profile_id,sport,league,selection,event,status,result_status,grading_state,preserved_at,created_at&source_type=eq.pre_event_filing'),
                  ('/rest/v1/profiles?" + PROFILE_SELECT + "&profile_id=eq." + encodeURIComponent(FEATURED_ID) + "&visibility=eq.public&limit=1', '/rest/v1/v_public_consultants?" + PROFILE_SELECT + "&profile_id=eq." + encodeURIComponent(FEATURED_ID) + "&limit=1'),
                  ('/rest/v1/profiles?" + PROFILE_SELECT + "&visibility=eq.public&consultant_type=neq.archive&order=profile_id.asc&limit=1', '/rest/v1/v_public_consultants?" + PROFILE_SELECT + "&consultant_type=neq.archive&order=profile_id.asc&limit=1'),
                  ('/rest/v1/profiles?select=profile_id,name,handle,doctrine_name&visibility=eq.public&consultant_type=neq.archive', '/rest/v1/v_public_consultants?select=profile_id,name,handle,doctrine_name&consultant_type=neq.archive'),
              ],
              "records.html": [
                  ('/rest/v1/records?select=profile_id,league,status,result_status&source_type=eq.pre_event_filing', '/rest/v1/v_public_records?select=profile_id,league,status,result_status&source_type=eq.pre_event_filing'),
                  ('/rest/v1/profiles?select=profile_id,name&', '/rest/v1/v_public_consultants?select=profile_id,name&'),
                  ('/rest/v1/records?" + params.join("&")', '/rest/v1/v_public_records?" + params.join("&")'),
              ],
              "consultant.html": [
                  ('/rest/v1/records?select=record_id,league,sport,selection,event,status,result_status,preserved_at,created_at', '/rest/v1/v_public_records?select=record_id,league,sport,selection,event,status,result_status,preserved_at,created_at'),
                  ('/rest/v1/profiles?select=profile_id,name,handle,doctrine_name,doctrine_statement,edge_theory,', '/rest/v1/v_public_consultants?select=profile_id,name,handle,doctrine_name,doctrine_statement,edge_theory,'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one match, found {count}: {old[:80]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          for filename in replacements:
              text = Path(filename).read_text()
              if '/rest/v1/profiles?' in text or '/rest/v1/records?' in text:
                  raise SystemExit(f"{filename}: lingering raw-table request")

      - name: Commit migrated files
        run: |
          rm -f .github/public-view-migration.patch
          rm -f .github/workflows/apply-public-view-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html records.html consultant.html .github
          git commit -m "Migrate public pages to RLS-safe views [migration-applied]"
          git push origin HEAD:preview/public-view-query-migration
