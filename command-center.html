<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operator Command Center | vaultverified.app</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090909;--panel:#111213;--line:#242729;--text:#f2f3f3;--muted:#8b9297;--dim:#555c61;--cyan:#00d4ff;--green:#3ddc84;--amber:#f0b34a;--red:#e36b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace}.wrap{max-width:980px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:28px}.brand{font-size:12px;font-weight:700;letter-spacing:.12em}.eyebrow{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);margin-top:6px}.btn{border:1px solid var(--line);background:transparent;color:var(--muted);font:600 10px 'IBM Plex Mono';padding:9px 11px;cursor:pointer}.login{max-width:520px;margin:70px auto 0;border:1px solid var(--line);background:var(--panel);padding:22px}.login h1{font-size:23px;margin:0 0 10px}.login p{font-size:11px;line-height:1.7;color:var(--muted)}input{width:100%;background:#0d0e0f;border:1px solid var(--line);color:var(--text);padding:13px;font:12px 'IBM Plex Mono';margin:16px 0 10px}.primary{width:100%;background:var(--cyan);border:0;color:#071014;font:700 11px 'IBM Plex Mono';padding:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}.msg{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.6}.hidden{display:none!important}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.metric{border:1px solid var(--line);background:var(--panel);padding:14px}.metric .n{font-size:24px;font-weight:700}.metric .l{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:8px}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 9px 'IBM Plex Mono';padding:8px 9px;cursor:pointer}.filter.active{border-color:var(--cyan);color:var(--cyan)}.updated{font-size:9px;color:var(--dim);margin:7px 0 14px}.cards{display:grid;gap:10px}.card{border:1px solid var(--line);background:var(--panel);padding:15px}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.name{font-size:14px;font-weight:700}.handle{font-size:10px;color:var(--muted);margin-top:3px}.state{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.ACTIVATED{color:var(--green)}.FIRST_RECORD_DUE{color:var(--amber)}.ENROLLMENT_NOT_ESTABLISHED{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.k{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.v{font-size:10px;margin-top:3px;overflow-wrap:anywhere}.action{margin-top:12px;border-left:2px solid var(--cyan);padding-left:10px}.action .v{font-size:11px}.empty{border:1px solid var(--line);padding:30px;text-align:center;color:var(--dim);font-size:11px}.error{border:1px solid #663838;color:#efb4b4;padding:12px;font-size:10px;margin-bottom:12px}.spinner{padding:35px;text-align:center;color:var(--dim);font-size:10px}@media(max-width:620px){.metrics{grid-template-columns:1fr 1fr 1fr}.metric{padding:12px 9px}.metric .n{font-size:20px}.grid{grid-template-columns:1fr}.top{margin-bottom:20px}}
</style>
</head>
<body><div class="wrap">
<section id="login" class="login hidden"><div class="eyebrow">Private operations</div><h1>Operator Command Center</h1><p>Authorized access only. Enter the Vault admin email and use the secure sign-in link sent to that inbox.</p><input id="email" type="email" autocomplete="email" placeholder="Admin email"><button class="primary" id="sendLink">Send secure sign-in link</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="hidden"><div class="top"><div><div class="brand">VAULT VERIFIED</div><div class="eyebrow">Operator Command Center</div></div><div><button class="btn" id="refresh">Refresh</button> <button class="btn" id="signOut">Sign out</button></div></div><div id="error" class="error hidden"></div><div class="metrics"><div class="metric"><div class="n" id="activated">0</div><div class="l">Activated</div></div><div class="metric"><div class="n" id="due">0</div><div class="l">First Record Due</div></div><div class="metric"><div class="n" id="notEstablished">0</div><div class="l">Enrollment Missing</div></div></div><div class="filters"><button class="filter active" data-state="ALL">All</button><button class="filter" data-state="ACTIVATED">Activated</button><button class="filter" data-state="FIRST_RECORD_DUE">First Record Due</button><button class="filter" data-state="ENROLLMENT_NOT_ESTABLISHED">Enrollment Missing</button></div><div class="updated" id="updated"></div><div id="cards" class="cards"><div class="spinner">Loading current operator state…</div></div></section>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://apmrgvpegtfsqqjcokfv.supabase.co';
const KEY='sb_publishable_8K6RZjl132H3O2US8zZX9g_F2sZ3OaY';
const API=URL+'/functions/v1/operator-command-center';
const supabase=createClient(URL,KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);let rows=[],filter='ALL';
function esc(v){return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.valueOf())?esc(v):d.toLocaleString()}
function render(){const list=filter==='ALL'?rows:rows.filter(r=>r.activation_state===filter);$('cards').innerHTML=list.length?list.map(r=>`<article class="card"><div class="row"><div><div class="name">${esc(r.full_name||r.primary_handle||r.application_id)}</div><div class="handle">${esc(r.primary_handle||'')} · ${esc(r.program||'')}</div></div><div class="state ${esc(r.activation_state)}">${esc((r.activation_state||'UNKNOWN').replaceAll('_',' '))}</div></div><div class="grid"><div><div class="k">Application</div><div class="v">${esc(r.application_status)} · ${esc(r.application_id)}</div></div><div><div class="k">Profile / Auth</div><div class="v">${esc(r.profile_status)} · ${r.last_sign_in_at?'signed in':'no sign in'}</div></div><div><div class="k">Records</div><div class="v">${esc(r.total_records)} total · first ${fmt(r.first_record_at)}</div></div><div><div class="k">Latest record</div><div class="v">${esc(r.last_record_id)} · ${fmt(r.last_record_at)}</div></div><div><div class="k">Acquisition stage</div><div class="v">${esc(r.acquisition_stage)}</div></div><div><div class="k">Blocker</div><div class="v">${esc(r.acquisition_blocker_code)}${r.acquisition_requires_human_approval?' · HUMAN APPROVAL':''}</div></div></div><div class="action"><div class="k">Next action</div><div class="v">${esc(r.acquisition_next_action||'No queued acquisition action')}</div></div></article>`).join(''):'<div class="empty">No operators in this state.</div>'}
async function load(){const {data:{session}}=await supabase.auth.getSession();if(!session){$('app').classList.add('hidden');$('login').classList.remove('hidden');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('error').classList.add('hidden');$('cards').innerHTML='<div class="spinner">Loading current operator state…</div>';try{const r=await fetch(API,{headers:{Authorization:'Bearer '+session.access_token,apikey:KEY}});const d=await r.json();if(r.status===403){await supabase.auth.signOut();throw new Error('This account is not authorized for the command center.')}if(!r.ok)throw new Error('Command center unavailable.');rows=d.operators||[];$('activated').textContent=d.counts?.ACTIVATED||0;$('due').textContent=d.counts?.FIRST_RECORD_DUE||0;$('notEstablished').textContent=d.counts?.ENROLLMENT_NOT_ESTABLISHED||0;$('updated').textContent='Current as of '+new Date(d.generated_at).toLocaleString();render()}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden');$('cards').innerHTML=''}}
$('sendLink').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('loginMsg').textContent='Enter the authorized admin email.';$('loginMsg').textContent='Sending…';const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/command-center.html',shouldCreateUser:true}});$('loginMsg').textContent=error?error.message:'Check that inbox. Open the secure sign-in link on this device.'};
$('refresh').onclick=load;$('signOut').onclick=async()=>{await supabase.auth.signOut();location.reload()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.state;render()});
supabase.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script></body></html>
